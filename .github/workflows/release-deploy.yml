name: Release EnPra bridge

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: enpra-production-deploy
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: version
        name: Enforce semantic version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be exactly vMAJOR.MINOR.PATCH (for example v0.1.0)."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version ($package_version) must match release tag ($version)."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and publish bridge image
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: image
        name: Define image name
        run: echo "value=ghcr.io/sean-59/enpra-bridge" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.value }}:${{ needs.validate-release.outputs.version }}
            ${{ steps.image.outputs.value }}:latest

  deploy:
    name: Deploy to NAS
    needs: [validate-release, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log NAS into GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            '/usr/local/bin/docker login ghcr.io --username SEAN-59 --password-stdin'

      - name: Pull release image and restart EnPra
        env:
          COMPOSE_PATH: ${{ vars.COMPOSE_PATH || secrets.COMPOSE_PATH }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -eu
            cd '$COMPOSE_PATH'
            sed -i 's|^ENPRA_RELEASE_IMAGE=.*|ENPRA_RELEASE_IMAGE=$IMAGE:$VERSION|' .env
            /usr/local/bin/docker compose --env-file .env -f compose.yaml pull bridge
            /usr/local/bin/docker compose --env-file .env -f compose.yaml up -d --wait --wait-timeout 120
            /usr/local/bin/docker compose --env-file .env -f compose.yaml ps"
