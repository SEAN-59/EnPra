name: enpra

services:
  bridge:
    image: ${ENPRA_RELEASE_IMAGE:?Set ENPRA_RELEASE_IMAGE in .env}
    container_name: ${ENPRA_APP_CONTAINER_NAME:?Set ENPRA_APP_CONTAINER_NAME in .env}
    restart: unless-stopped
    env_file:
      - ./app/app.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "${ENPRA_CONTAINER_PORT:?Set ENPRA_CONTAINER_PORT in .env}"
    ports:
      - "${ENPRA_BIND_ADDR:?Set ENPRA_BIND_ADDR in .env}:${ENPRA_HOST_PORT:?Set ENPRA_HOST_PORT in .env}:${ENPRA_CONTAINER_PORT:?Set ENPRA_CONTAINER_PORT in .env}"
    volumes:
      # Codex device-login data is persisted here until the Postgres migration is complete.
      - ./app/data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - enpra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:${POSTGRES_IMAGE_TAG:?Set POSTGRES_IMAGE_TAG in .env}
    container_name: ${ENPRA_DB_CONTAINER_NAME:?Set ENPRA_DB_CONTAINER_NAME in .env}
    restart: unless-stopped
    env_file:
      - ./db/db.env
    environment:
      POSTGRES_CONTAINER_PORT: "${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}"
    command: ["postgres", "-c", "port=${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}"]
    volumes:
      - ./db/data:/var/lib/postgresql/data
    networks:
      - enpra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_CONTAINER_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  enpra:
    name: ${ENPRA_NETWORK_NAME:?Set ENPRA_NETWORK_NAME in .env}
